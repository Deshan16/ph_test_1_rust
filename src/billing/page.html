<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing</title>
</head>
<body>
    <div class="top_bar">
        <div class="nav_drawer">
            <button>≡</button>
        </div>
        <div class="title">
            <span>Billing</span>
        </div>
    </div>
    <div class="billing_table">
        <table>
            <thead>
                <th>Product ID</th>
                <th>Product Type</th>
                <th>Name</th>
                <th>Unit Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </thead>
        </table>
    </div>
    <div class="search_window">
        <div class="search">
            <input type="text" id="search_text" placeholder="Type here to search">
            <button class="clear" hidden>Clear</button>
        </div>
        <div class="search_results" hidden>
            <table>
                <thead>
                    <th>Product ID</th>
                    <th>Product Type</th>
                    <th>Name</th>
                    <th>Generic Name</th>
                    <th>Company</th>
                    <th>Form</th>
                    <th>Strength</th>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="search_batch_results" hidden>
            <table id="batch_table">
                <thead>
                    <tr>
                        <th>Batch ID</th>
                        <th>Batch Number</th>
                        <th>Unit Sell Price</th>
                        <th>Expiry Date</th>
                        <th>Current Stock</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</body>
</html>
