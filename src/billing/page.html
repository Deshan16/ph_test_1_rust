<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing</title>
    <link rel="stylesheet" href="billing.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.ts"></script>
    <script type="module" src="../interfaces.ts"></script>
    <script type="module" src="../invokes.ts"></script>
</head>
<body>
    <div class="top_bar">
        <div class="nav_drawer">
            <button>≡</button>
        </div>
        <div class="title">
            <span>Billing</span>
        </div>
    </div>
    
    <div class="billing_table">
        <table id="billing_table">
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Product Type</th>
                    <th>Name</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr class="add_row">
                    <td colspan="6"><span class="plus">+</span> Add item</td>
                </tr>
            </tfoot>
        </table>
    </div>    
    
    <div class="total_bar">
        <button class="btn btn_danger" id="cancel_order" disabled>Cancel order</button>
        <span class="total_label">Total</span>
        <span class="total_amount" id="grand_total">0.00</span>
        <button class="btn btn_primary" id="checkout" disabled>Checkout</button>
    </div>
    
    <div class="search_window" hidden>
        <div class="search">
            <input type="text" id="search_text" placeholder="Type here to search">
            <button class="clear" id="clear" hidden>Clear</button>
        </div>
        <div class="search_table_box" hidden>
            <table class="search_table">
                <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Product Type</th>
                        <th>Name</th>
                        <th>Generic Name</th>
                        <th>Company</th>
                        <th>Form</th>
                        <th>Strength</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="search_batch_results" hidden>
            <table id="batch_table">
                <thead>
                    <tr>
                        <th>Batch ID</th>
                        <th>Batch Number</th>
                        <th>Unit Sell Price</th>
                        <th>Expiry Date</th>
                        <th>Current Stock</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <div class="checkout_window" hidden>
        <div class="checkout_header">
            <span>Checkout</span>
            <button class="checkout_close" id="checkout_close" aria-label="Close checkout">✕</button>
        </div>

        <div class="checkout_body">
            <div class="summary_row">
                <span>Items</span>
                <span id="checkout_items">0</span>
            </div>
            <div class="summary_row summary_total">
                <span>Total</span>
                <span id="checkout_total">0.00</span>
            </div>

            <label class="field">
                <span>Payment method</span>
                <select id="payment_method">
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                </select>
            </label>

            <label class="field">
                <span>Amount paid</span>
                <input type="text" id="amount_paid" min="0" step="0.01" placeholder="0.00">
            </label>

            <div class="summary_row change_row">
                <span>Change</span>
                <span id="change_amount">0.00</span>
            </div>
        </div>

        <div class="checkout_footer">
            <button class="btn btn_danger" id="cancel_checkout">Cancel checkout</button>
            <button class="btn btn_primary" id="next_customer">Next customer</button>
        </div>
    </div>
    <div class="overlay"></div>
</body>
</html>
