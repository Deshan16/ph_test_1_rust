<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Window</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.ts"></script>
</head>
<body>
    <div class="top_bar">
        <div class="title">
            <span>Inventory</span>
        </div>
    </div>
    
    <div class="search">
        <input type="text" id="search_text" placeholder="Type here to search">
        <button class="clear" hidden>Clear</button>
    </div>
    
    <div class="legend">
        <span class="legend_item critical">Low in stock + In Expiry Period</span>
        <span class="legend_item expiring">Expiring soon</span>
        <span class="legend_item low-stock">Low stock</span>
    </div>
    
    <div class="inventory_display">
        <table id="invn_table">
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Product Type</th>
                    <th>Name</th>
                    <th>Generic Name</th>
                    <th>Company</th>
                    <th>Form</th>
                    <th>Strength</th>
                    <th>Stock</th>
                    <th>Reorder Level</th>
                    <th>Expiry Warning</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div class="batch_window" hidden>
        <table id="batch_table">
            <thead>
                <tr>
                    <th>Batch ID</th>
                    <th>Batch Number</th>
                    <th>Unit Bought Price</th>
                    <th>Unit Sell Price</th>
                    <th>Expiry Date</th>
                    <th>Current Stock</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div class="overlay" hidden></div>
    
    <div class="row_menu" id="row_menu" hidden>
        <button type="button" class="row_menu_item" data-action="enable_reorder">Edit Reorder level</button>
        <button type="button" class="row_menu_item" data-action="enable_expiry">Edit Expiry Warning</button>
    </div>
    <div class="summary_bar">
        <!-- <span class="summary_item">Products: <strong id="sum_products">0</strong></span>
        <span class="summary_item">Low stock: <strong id="sum_low">0</strong></span> -->
        <span class="summary_item summary_total">Total value: <strong id="sum_value">0.00</strong></span>
    </div>
</body>
</html>
