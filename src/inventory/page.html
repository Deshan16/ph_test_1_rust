<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Window</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.ts"></script>
    <script type="module" src="../interfaces.ts"></script>
    <script type="module" src="../invokes.ts"></script>
</head>
<body>
    <div class="top_bar">
        <div class="nav_drawer">
            <button>≡</button>
        </div>
        <div class="title">
            <span>Inventory</span>
        </div>
    </div>
    <div class="search">
        <input type="text" id="search_text" placeholder="Type here to search">
        <button class="clear" hidden>Clear</button>
    </div>
    <div class="legend">
        <span class="legend_item critical">Critical</span>
        <span class="legend_item expiring">Expiring soon</span>
        <span class="legend_item low-stock">Low stock</span>
    </div>
    <div class="inventory_display">
        <table id="invn_table">
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Product Type</th>
                    <th>Name</th>
                    <th>Generic Name</th>
                    <th>Company</th>
                    <th>Form</th>
                    <th>Strength</th>
                    <th>Stock</th>
                    <th>Reorder Level</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="batch_window" hidden>
        <table id="batch_table">
            <thead>
                <tr>
                    <th>Batch ID</th>
                    <th>Batch Number</th>
                    <th>Unit Bought Price</th>
                    <th>Unit Sell Price</th>
                    <th>Expiry Date</th>
                    <th>Current Stock</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div> 
    <div class="overlay" hidden></div>
</body>
</html>
